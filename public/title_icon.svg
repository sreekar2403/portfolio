<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d61e4"/>
      <stop offset="1" stop-color="#1c349b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="7" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#f6b73c"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="24" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17a396"/>
      <stop offset="1" stop-color="#0c5f58"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="32" height="32" rx="7.5"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- shoulders / shirt -->
    <path d="M6.5 32C6.9 27.2 10.6 24.3 16 24.3C21.4 24.3 25.1 27.2 25.5 32Z" fill="url(#shirt)"/>
    <path d="M12.8 24.6L16 28.3L19.2 24.6" stroke="#0a4f49" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- neck -->
    <rect x="14.15" y="19.8" width="3.7" height="4.6" rx="1.8" fill="#e8a93a"/>
    <!-- ears -->
    <circle cx="9.05" cy="15.3" r="1.4" fill="#f3b33c"/>
    <circle cx="22.95" cy="15.3" r="1.4" fill="#f3b33c"/>
    <!-- head -->
    <circle cx="16" cy="14.3" r="7.15" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M9.4 14.2C8.9 9.4 11.8 6.4 16 6.4C20.4 6.4 23.4 9.2 22.9 14.4C22.5 12.6 21.7 11.4 20.6 10.7C18.6 12 14.4 12.2 12 10.9C10.9 11.6 10 12.7 9.4 14.2Z" fill="#35261b"/>
    <!-- eyebrows -->
    <path d="M12 13.4Q13.2 12.8 14.4 13.3" stroke="#35261b" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M17.6 13.3Q18.8 12.8 20 13.4" stroke="#35261b" stroke-width="0.85" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="13" cy="15.6" rx="1.15" ry="1.4" fill="#31241a"/>
    <ellipse cx="19" cy="15.6" rx="1.15" ry="1.4" fill="#31241a"/>
    <circle cx="13.45" cy="15" r="0.45" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="19.45" cy="15" r="0.45" fill="#ffffff" fill-opacity="0.95"/>
    <!-- blush -->
    <ellipse cx="11.2" cy="18.4" rx="1.5" ry="1" fill="#f08a7e" fill-opacity="0.4"/>
    <ellipse cx="20.8" cy="18.4" rx="1.5" ry="1" fill="#f08a7e" fill-opacity="0.4"/>
    <!-- smile -->
    <path d="M13.4 18.6Q16 21.4 18.6 18.6Z" fill="#4d3623"/>
    <!-- gloss -->
    <path d="M0 0H32V6C22.5 10.5 9.5 10.5 0 6Z" fill="#ffffff" fill-opacity="0.07"/>
  </g>

  <!-- inner edge highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
</svg>
